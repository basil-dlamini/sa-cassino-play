<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table preview — straight columns</title>
<style>
  :root { --ivory: #f4efe2; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(120% 90% at 50% 0%, #16294f 0%, #0b1836 55%, #070f24 100%);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ivory);
    display: flex; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 440px; padding: 18px 16px 24px;
  }
  .pv-note {
    text-align: center; font-size: .8rem; opacity: .7; margin-bottom: 14px;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .verdict { text-align: center; padding: 0 0 12px; }
  .verdict-title {
    font-size: clamp(1.2rem, 5.5vw, 1.6rem); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: #ffd682;
  }
  .verdict-score {
    font-size: clamp(1.9rem, 9.5vw, 2.6rem); font-weight: 800; line-height: 1;
  }
  .verdict-session { margin-top: 3px; font-size: .78rem; opacity: .72; }
  .head {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 4px 0 10px;
  }
  .head .side { text-align: center; }
  .head .side .nm {
    display: block; font-size: .88rem; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .head .side.lose { opacity: .78; }
  .head .side.win .nm, .head .side.win .tt { color: #ffd682; }
  .head .side .tt { font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
  .head .mid { font-size: .72rem; font-weight: 700; opacity: .5; text-transform: uppercase; letter-spacing: .1em; }

  /* THE PREVIEW: one real table — every column a single straight channel,
     border-collapse draws unbroken lines, all text centred */
  table.pv {
    width: 100%; border-collapse: collapse;
    background: rgba(244,239,226,.04);
    border: 1px solid rgba(244,239,226,.22);
  }
  table.pv td, table.pv th {
    text-align: center; padding: 3px 8px;
    border: 1px solid rgba(244,239,226,.14);
    white-space: nowrap;
  }
  table.pv .pts { font-size: 1.02rem; font-weight: 800; }
  table.pv .pts.win { color: #ffd682; }
  table.pv .val { font-size: 1.12rem; font-weight: 800; color: var(--ivory); }
  table.pv .lab {
    font-size: .84rem; font-weight: 700; opacity: .85;
    text-transform: uppercase; letter-spacing: .05em;
  }
  table.pv tr.total td, table.pv tr.total th {
    border-top: 2px solid rgba(244,239,226,.3);
    background: rgba(244,239,226,.05);
  }
  table.pv tr.total .pts { font-size: 1.4rem; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="pv-note">Preview — straight columns, centred text</div>
    <div class="verdict">
      <div class="verdict-title">You win!</div>
      <div class="verdict-score">6<small>&ndash;</small>4</div>
      <div class="verdict-session">Session: You 3 &middot; Sipho 1 &mdash; 5 games</div>
    </div>
    <div class="head">
      <div class="side win"><span class="nm">You</span><span class="tt">6</span></div>
      <span class="mid">vs</span>
      <div class="side lose"><span class="nm">Sipho</span><span class="tt">4</span></div>
    </div>
    <table class="pv">
      <tr><td class="pts win">2</td><td class="val">1</td><th class="lab">10&diams; Big 10</th><td class="val">0</td><td class="pts"></td></tr>
      <tr><td class="pts win">1</td><td class="val">1</td><th class="lab">2&spades; Spy</th><td class="val">0</td><td class="pts"></td></tr>
      <tr><td class="pts win">1</td><td class="val">1</td><th class="lab">A&spades;</th><td class="val">0</td><td class="pts"></td></tr>
      <tr><td class="pts"></td><td class="val">0</td><th class="lab">A&hearts;</th><td class="val">1</td><td class="pts win">1</td></tr>
      <tr><td class="pts"></td><td class="val">0</td><th class="lab">A&diams;</th><td class="val">1</td><td class="pts win">1</td></tr>
      <tr><td class="pts win">1</td><td class="val">1</td><th class="lab">A&clubs;</th><td class="val">0</td><td class="pts"></td></tr>
      <tr><td class="pts win">2</td><td class="val">6</td><th class="lab">Spades</th><td class="val">4</td><td class="pts"></td></tr>
      <tr><td class="pts"></td><td class="val">19</td><th class="lab">Cards</th><td class="val">21</td><td class="pts win">2</td></tr>
      <tr><td class="pts"></td><td class="val">0</td><th class="lab">Points sweep</th><td class="val">0</td><td class="pts"></td></tr>
      <tr><td class="pts"></td><td class="val">0</td><th class="lab">Cards sweep</th><td class="val">0</td><td class="pts"></td></tr>
      <tr class="total"><td class="pts win">6</td><td class="val"></td><th class="lab">Total</th><td class="val"></td><td class="pts">4</td></tr>
    </table>
  </div>
</body>
</html>
